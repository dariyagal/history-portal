  "Kazakh society, fragmented after Tawke Khan, faced the centralized, artillery-equipped Dzungar state (1643–1756). Heavy losses pushed the khans toward Russia: Abulkhair swore allegiance in 1731, and Middle and Great Zhüz leaders followed. Russia and the Kazakhs read this subjecthood differently.",
  "Russia then replaced khanal rule with statutes (1822, 1824, 1867–68, 1886, 1891), declared Kazakh land state property and opened it to settlers. The aim of this lecture is to trace how diplomacy turned into colonial administration, and how a new intelligentsia (Altynsarin, Abai, Alash) responded."],

 id: 6, title: "Kazakhstan from 1917 to 1940: WWI, Revolutions, Alash & Early Soviet Rule",

  "Three projects competed for the steppe: the Bolsheviks, the Alash Party and its autonomy, and the Turkestan Autonomy. The Civil War (1918–1920) ended in Soviet consolidation. The lecture traces War Communism, NEP and the stages of Kazakh state-building within the USSR, where korenizatsiya promoted Kazakh cadres but real power stayed with the Party."],

 id: 7, title: "Specificity of Political and Socio-Economic Modernization of Soviet Power",

    setM(m => ({ ...m, sel: { ...m.sel, [x.id]: nx } })); };
  const check = (x) => { const cur = sel[x.id] || [], ok = cur.length === x.a.length && cur.every(o => x.a.includes(o));
    setP(p => { const m = p.mock || { sel: {}, done: {} }; return { ...p, mock: { ...m, sel: { ...m.sel, [x.id]: cur }, done: { ...m.done, [x.id]: true } }, graded: { ...(p.graded || {}), [x.id]: ok } }; }); };
  const reset = () => setP(p => { const gr = { ...(p.graded || {}) }; Object.keys(gr).forEach(k => { if (k[0] === "m") delete gr[k]; }); return { ...p, graded: gr, mock: { sel: {}, done: {} } }; });
  const style = (x, o) => { if (!done[x.id]) return (sel[x.id] || []).includes(o) ? { borderColor: "var(--ac)", background: "var(--hi)" } : {};

        <tbody>{t.rows.map((r, i) => <tr key={i} className="border-t border-white/5 hover:bg-[#D8B458]/10 transition-colors">{r.map((c, j) => <td key={j} className="px-3 py-2 align-top">{c}</td>)}</tr>)}</tbody></table></div></div></div>)}</Section>
    <Section k="F" title="Historical Significance & Case Studies">{L.cases.map(c => <div key={c.t} className="card p-3 mb-2 text-sm"><b className="serif text-[#D8B458]">{c.t}.</b> {c.d}</div>)}</Section>
    <Section k="G" title="Must Memorize ⚡" ribbon><div className="grid sm:grid-cols-2 gap-3">{L.memorize.map((m, i) => <div key={m} className="bg-[#1B1E28] border border-white/10 rounded-lg p-3 transition-all duration-300 hover:bg-[#2A261C] hover:border-[#D8B458]">
      <div className="serif font-semibold text-sm text-[#D8B458] mb-1">📌 High-yield {pad(i + 1)}</div><div className="text-sm text-[#F3EFE6]">{m}</div></div>)}</div></Section>
    <Section k="H" title="Exam Cheat Sheet 📎"><ul className="list-disc ml-5 text-sm mb-4 space-y-1">{L.cheat.lines.map(m => <li key={m}>{m}</li>)}</ul>
      {L.cheat.qa.map(x => <details key={x.q} className="group mb-2 rounded-lg border border-white/10 bg-[#171920] open:bg-[#26231B] hover:bg-[#26231B] transition-colors duration-200">
        <summary className="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm font-semibold text-[#F3EFE6]"><span className="text-xs text-[#8A8F9E] transition-all duration-200 group-hover:text-[#D8B458] group-open:text-[#D8B458] group-open:rotate-90">▶</span>{x.q}</summary>
        <p className="px-4 pb-3 pl-10 text-sm text-[#C4C7D0]">{x.a}</p></details>)}</Section>
  </div>);
}

function Dashboard({ P }) {
  const D = LECTURES_DATA, g = Object.values(P.graded || {}), doneN = (P.done || []).length;
  const sc = g.length ? Math.round(100 * g.filter(Boolean).length / g.length) : null;
  const kpi = [["Total Lectures", 10, D.length * 10], ["Core Concepts & Dates", D.reduce((a, l) => a + l.concepts.length, 0), 100], ["Key Figures", D.reduce((a, l) => a + l.figures.length, 0), 100],
    ["Exam Questions", D.reduce((a, l) => a + l.cheat.qa.length, 0) + MOCK.length, 100], ["Lectures Completed", doneN + "/10", doneN * 10], ["Quiz Score", sc === null ? "–" : sc + "%", sc || 0]];
  const steps = ["Open a lecture from the sidebar and read sections A–H in order.", "Study Core Concepts & Dates, then Must Memorize.", "Use Key Figures to search people across lectures.", "Test yourself in Exam Questions and the Mock Exam Bank.", "Drill terms in Flashcards (Know / Review Again).", "Mark each lecture as studied to track progress."];
  return (<div><h1 className="text-3xl md:text-4xl font-bold mb-6">Study Dashboard</h1>
    <div className="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-8">{kpi.map(([a, b, pc]) => <div key={a} className="group relative overflow-hidden rounded-xl bg-[#171920] border border-white/10 p-5 transition-all duration-300 hover:-translate-y-0.5 hover:border-[rgba(216,180,88,0.35)] hover:shadow-[0_0_20px_rgba(216,180,88,0.12)]">
      <div className="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-[#D8B458] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300" />
      <div className="serif text-4xl font-bold text-[#F3EFE6]">{b}</div>
      <div className="text-[11px] uppercase tracking-widest text-[#8A8F9E] mt-1">{a}</div>
      <div className="h-1 bg-white/10 rounded mt-4"><div className="h-1 bg-[#D8B458] rounded transition-all duration-500" style={{ width: pc + "%" }} /></div></div>)}</div>
    <div className="rounded-xl bg-[#171920] border border-white/10 p-6"><h3 className="serif text-xl font-semibold text-[#F3EFE6] mb-3">How to Use This Portal</h3>
      <ol className="space-y-2 text-sm">{steps.map((t, i) => <li key={t} className="flex gap-3"><span className="serif text-[#D8B458] font-bold">{i + 1}</span><span>{t}</span></li>)}</ol></div></div>);
}

function Figures() {
  const [q, setQ] = useState(""), [lec, setLec] = useState(0);
  const all = LECTURES_DATA.flatMap(l => l.figures.map(f => ({ ...f, lec: l.id })));
  const list = all.filter(f => (!lec || f.lec === lec) && (f.n + f.role + f.contrib).toLowerCase().includes(q.toLowerCase()));
  return (<div><h1 className="text-2xl font-bold mb-4">Key Figures</h1>
    <div className="flex gap-2 mb-4 sans"><input className="card px-3 py-2 flex-1 text-sm" placeholder="Search figures…" value={q} onChange={e => setQ(e.target.value)} />
      <select className="card px-2 text-sm" value={lec} onChange={e => setLec(+e.target.value)}><option value={0}>All lectures</option>{LECTURES_DATA.map(l => <option key={l.id} value={l.id}>Lecture {pad(l.id)}</option>)}</select></div>
    <div className="grid sm:grid-cols-2 gap-3">{list.map(f => <div key={f.lec + f.n} className="card p-3"><div className="font-semibold">{f.n}</div>
      <div className="text-xs mut sans">{f.life} · {f.role} · L{pad(f.lec)}</div><div className="text-sm mt-1">{f.contrib}</div></div>)}</div></div>);
}

function Questions({ P, setP }) {
  const [lec, setLec] = useState(0), [open, setOpen] = useState({});
  const qs = LECTURES_DATA.flatMap(l => l.cheat.qa.map((x, i) => ({ ...x, id: l.id + "-" + i, lec: l.id }))).filter(x => !lec || x.lec === lec);
  const grade = (id, v) => setP(p => ({ ...p, graded: { ...(p.graded || {}), [id]: v } }));
  return (<div><h1 className="text-2xl font-bold mb-4">Exam Questions</h1>
    <select className="card px-2 py-2 text-sm mb-4 sans" value={lec} onChange={e => setLec(+e.target.value)}><option value={0}>All lectures</option>{LECTURES_DATA.map(l => <option key={l.id} value={l.id}>Lecture {pad(l.id)}</option>)}</select>
    {qs.map(x => <div key={x.id} className="card p-4 mb-3"><div className="text-xs mut sans">Lecture {pad(x.lec)}</div><div className="font-semibold">{x.q}</div>
      <button className="btn mt-2" onClick={() => setOpen(o => ({ ...o, [x.id]: !o[x.id] }))}>{open[x.id] ? "Hide" : "Reveal"} Model Answer</button>
      {open[x.id] && <div className="mt-2 text-sm"><p className="mb-2">{x.a}</p><div className="flex gap-2 sans">
        <button className={"btn " + (P.graded?.[x.id] === true ? "on" : "")} onClick={() => grade(x.id, true)}>✓ I got it</button>
        <button className={"btn " + (P.graded?.[x.id] === false ? "on" : "")} onClick={() => grade(x.id, false)}>✗ Missed it</button></div></div>}</div>)}</div>);
}

function Cards({ P, setP }) {
  const cards = LECTURES_DATA.flatMap(l => l.concepts.map(c => ({ ...c, id: l.id + "-" + c.t })));
  const [i, setI] = useState(0), [back, setBack] = useState(false);
  const c = cards[i % cards.length], mark = (v) => { setP(p => ({ ...p, cards: { ...(p.cards || {}), [c.id]: v } })); setBack(false); setI(i + 1); };
  const known = Object.values(P.cards || {}).filter(v => v === "know").length;
  return (<div><h1 className="text-2xl font-bold mb-1">Flashcards</h1><p className="mut text-sm mb-4 sans">Card {i % cards.length + 1} of {cards.length} · Known: {known}</p>
    <div className="card flip p-8 flex items-center justify-center text-center" onClick={() => setBack(!back)}>
      {back ? <div><div className="text-xs ac sans mb-2">DEFINITION / SIGNIFICANCE</div><div>{c.d}</div></div> : <div><div className="text-xs ac sans mb-2">TERM / DATE (click to flip)</div><div className="text-2xl font-bold">{c.t}</div></div>}</div>
    <div className="flex gap-2 mt-4 sans"><button className="btn" onClick={() => mark("know")}>✓ Know</button><button className="btn" onClick={() => mark("review")}>↻ Review Again</button></div></div>);
}

function App() {
  const [view, setView] = useState("dash"), [P, setP] = useState(load);
  useEffect(() => { try { localStorage.setItem("qt_progress", JSON.stringify(P)); } catch (e) {} }, [P]);
  useEffect(() => { window.scrollTo(0, 0); }, [view]);
  const done = P.done || [];
  const toggle = (id) => setP(p => ({ ...p, done: (p.done || []).includes(id) ? p.done.filter(x => x !== id) : [...(p.done || []), id] }));
  const tools = [["dash", "📊 Dashboard"], ["figs", "👤 Key Figures"], ["qs", "📝 Exam Questions"], ["mock", "🎯 Mock Exam Bank"], ["cards", "⚡ Flashcards"]];
  const L = typeof view === "number" ? LECTURES_DATA.find(l => l.id === view) : null;
  return (<div className="md:flex min-h-screen">
    <aside className="sb sans md:fixed md:inset-y-0 md:left-0 md:w-72 p-4 md:overflow-y-auto">
      <div className="serif text-2xl font-bold text-[#F3EFE6]">Qazaq<span className="text-[#D8B458]">Tarikh</span></div>
      <div className="text-[11px] text-[#8A8F9E] mb-5 leading-snug">Interactive Final Exam Preparation Portal • 10 Lectures • History of Kazakhstan • Astana IT University</div>
      <div className="text-[11px] uppercase tracking-widest text-[#8A8F9E] mb-1 mt-1">Course Lectures</div>
      <div className="mb-4">{Array.from({ length: 10 }, (_, k) => k + 1).map(n => { const has = LECTURES_DATA.some(l => l.id === n);
        return <button key={n} className={view === n ? "on" : ""} disabled={!has} style={has ? {} : { opacity: .4 }} onClick={() => setView(n)}>
          <b className="mr-2">{pad(n)}</b>{has ? LECTURES_DATA.find(l => l.id === n).title.split(",")[0].split("(")[0].slice(0, 28) : "Coming soon"}{done.includes(n) && <span className="float-right">✓</span>}</button>; })}</div>
      <div className="text-[11px] uppercase tracking-widest text-[#8A8F9E] mb-1 mt-1">Quick Tools</div>
      {tools.map(([k, t]) => <button key={k} className={view === k ? "on" : ""} onClick={() => setView(k)}>{t}</button>)}
    </aside>
    <main className="md:ml-72 flex-1 p-5 md:p-8 max-w-5xl">
      {L ? <Lecture L={L} done={done.includes(L.id)} toggle={() => toggle(L.id)} /> : view === "dash" ? <Dashboard P={P} /> : view === "figs" ? <Figures /> : view === "qs" ? <Questions P={P} setP={setP} /> : view === "mock" ? <Mock P={P} setP={setP} /> : <Cards P={P} setP={setP} />}
    </main></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
